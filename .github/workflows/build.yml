name: Build Driver
on: push

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC + WDK11
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build x64 Release driver
        run: |
          msbuild minidrv.vcxproj /p:Platform=x64 /p:Configuration=Release

      - name: Upload sys artifact
        uses: actions/upload-artifact@v4
        with:
          name: minidrv-sys
          path: x64\Release\minidrv.sys
