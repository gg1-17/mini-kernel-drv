name: Build Kernel Driver
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Windows Driver Kit 10.0.26100
        run: |
          winget install --source winget --exact --id Microsoft.WindowsWDK.10.0.26100 --silent --accept-source-agreements --accept-package-agreements
        shell: pwsh

      - name: Wait & Verify WDK km folder
        run: |
          $wdkKmPath = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km"
          for($i=0;$i -lt 30;$i++){
            if(Test-Path $wdkKmPath){
              Write-Host "WDK km directory ready"
              break
            }
            Start-Sleep -Seconds 2
            Write-Host "Waiting for WDK files..."
          }
          if(-not (Test-Path $wdkKmPath)){
            throw "WDK km folder not found after wait!"
          }
        shell: pwsh

      - name: Check ntddk.h exists
        run: |
          dir "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km\ntddk.h"
        shell: cmd

      - name: Build Driver CL+Link
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set "WDK_INC=C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km"
          set "WDK_LIB=C:\Program Files (x86)\Windows Kits\10\Lib\10.0.26100.0\km\x64"
          cl /c /I"%WDK_INC%" /Zi /O2 /D _AMD64_ /D _KERNEL_MODE minidrv.c
          link minidrv.obj /LIBPATH:"%WDK_LIB%" ntoskrnl.lib /SUBSYSTEM:NATIVE /DRIVER /ENTRY:DriverEntry
        shell: cmd

      - name: List files debug
        run: dir
        shell: cmd

      - name: Upload compiled sys
        uses: actions/upload-artifact@v4
        with:
          name: driver-sys
          path: minidrv.sys
