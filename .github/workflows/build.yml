name: Build Driver
on: push

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install WDK via winget
        run: |
          winget install Microsoft.WindowsWDK.10.0.26100 --silent --accept-package-agreements --accept-source-agreements

      - name: Build project
        run: msbuild minidrv.vcxproj /p:Platform=x64 /p:Configuration=Release

      - name: Upload sys artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver-sys
          path: x64\Release\minidrv.sys
