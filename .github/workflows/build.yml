name: Build Driver
on: push

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download & Extract EWDK
        run: |
          $url = "https://download.microsoft.com/download/1/3/8/1389246B-4D45-474D-9949-36B018407235/EWDK.ISO"
          Invoke-WebRequest -Uri $url -OutFile ewdk.iso
          Mount-DiskImage -ImagePath .\ewdk.iso
          $drive = (Get-DiskImage .\ewdk.iso | Get-Volume).DriveLetter
          mkdir ewdk
          Copy-Item "${drive}:\*" ewdk -Recurse
          Dismount-DiskImage -ImagePath .\ewdk.iso

      - name: Build driver with EWDK
        run: |
          .\ewdk\LaunchBuildEnv.cmd -NoLogo
          msbuild minidrv.vcxproj /p:Platform=x64 /p:Configuration=Release

      - name: Upload sys artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver-sys
          path: x64\Release\minidrv.sys
