name: Build Driver
on: push

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC + WDK11
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build x64 Release driver
        run: |
          msbuild /p:Platform=x64 /p:Configuration=Release
