name: Build Kernel Driver
on: push

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Windows Driver Kit 10.0.26100
        run: |
          winget install --source winget --exact --id Microsoft.WindowsWDK.10.0.26100 --silent --accept-source-agreements --accept-package-agreements
        shell: pwsh

      - name: Wait for WDK files to be fully extracted
        run: |
          $wdkKmPath = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km"
          for($i=0;$i -lt 30;$i++){
            if(Test-Path $wdkKmPath){
              Write-Host "WDK km directory ready"
              break
            }
            Start-Sleep -Seconds 2
            Write-Host "Waiting for WDK files..."
          }
          if(-not (Test-Path $wdkKmPath)){
            throw "WDK km folder not found after wait!"
          }
        shell: pwsh

      - name: Setup MSVC + Append WDK km paths & Build
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set "INCLUDE=C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km;%INCLUDE%"
          set "LIB=C:\Program Files (x86)\Windows Kits\10\Lib\10.0.26100.0\km\x64;%LIB%"
          echo === INCLUDE ===
          echo %INCLUDE%
          echo === LIB ===
          echo %LIB%
          msbuild minidrv.vcxproj /p:Platform=x64 /p:Configuration=Release
        shell: cmd

      - name: Upload sys artifact
        uses: actions/upload-artifact@v4
        with:
          name: minidrv-sys
          path: x64\Release\minidrv.sys
